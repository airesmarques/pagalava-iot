# Validation for the PagaLava IoT firmware.
#
# The point of this pipeline is one lesson, learned expensively: code that works
# on a developer machine and on the golden image can still be unable to start on
# the devices in the field. 1.8 shipped with an annotation that is valid on
# Python 3.10+ and raises TypeError on 3.9. It passed every check we had. On a
# Debian 11 laundromat it crash-looped 63 times, and the only reason it was
# fixed in minutes is that that particular site was reachable by SSH. Most are
# not — a device that will not start is a van and an afternoon.
#
# So nothing here reasons about the code. Every job runs it, on the operating
# system it will actually meet, and checks the service starts.

stages:
  - test
  - compatibility
  - migration

variables:
  GIT_DEPTH: "0"          # migration tests need history, not a shallow clone
  DOCKER_DRIVER: overlay2

default:
  interruptible: true

# ---------------------------------------------------------------------------
# Fast checks. These run on every push and should stay quick enough that nobody
# is tempted to skip them.
# ---------------------------------------------------------------------------
unit:
  stage: test
  image: python:3.12-slim
  before_script:
    # The tests import ReceiveMessages, so its real dependencies must be here.
    # RPi.GPIO and spidev are the exception: the tests stub those in sys.modules
    # because they cannot be installed off a Pi.
    # git is needed by the upgrade-rollback test, which builds a throwaway
    # upstream and device clone. python:*-slim does not ship it.
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
    - pip install -q pytest azure-iot-device python-dotenv requests
  script:
    - python -m pytest tests/ -q
    - bash tests/test_firstboot.sh
    - bash tests/test_upgrade_rollback.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# ---------------------------------------------------------------------------
# Does the service START on every OS we support?
#
# One job per Debian version, so a failure names the OS instead of making
# someone read a log. If a setup_pagalava_iot_debianNN.sh exists, that OS
# belongs in this matrix — an OS with a setup script and no job here is an
# untested OS.
# ---------------------------------------------------------------------------
os-compatibility:
  stage: compatibility
  image: docker:27
  services:
    - docker:27-dind
  parallel:
    matrix:
      - DEBIAN: ["11", "12", "13"]
  script:
    - apk add --no-cache bash git >/dev/null
    - bash tests/test_os_matrix.sh "$DEBIAN"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true

# ---------------------------------------------------------------------------
# Can a device on any version in the field migrate to this commit and still
# start? This is the job that would have caught the 1.8 failure.
#
# Every version x every OS. It is only compute, and compute is cheaper than a
# site visit.
# ---------------------------------------------------------------------------
migration:
  stage: migration
  image: docker:27
  services:
    - docker:27-dind
  parallel:
    matrix:
      - DEBIAN: ["11", "12", "13"]
  script:
    - apk add --no-cache bash git >/dev/null
    - bash tests/test_migration_matrix.sh "$CI_COMMIT_SHA" "$DEBIAN"
  rules:
    # Always before something can reach a device: main is what upgrades pull,
    # and release/* is what image devices follow.
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: manual
      allow_failure: true
